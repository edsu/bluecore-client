name: Publish to PyPI

# Requires this repo to be registered as a trusted publisher on PyPI, so no
# API token is needed: https://docs.pypi.org/trusted-publishers/

on:
  release:
    types:
      published

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/bluecore-client

    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Don't publish something that doesn't pass its own tests.
      - name: Check
        run: |
          uv run ruff format --diff
          uv run ruff check
          uv run ty check
          uv run pytest

      - name: Publish
        run: |
          uv build
          uv publish
