name: Test
on:
  - push
  - pull_request
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12, 3.13]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # The three checks run before the tests, so a formatting or typing
      # problem fails fast instead of waiting on the suite.
      - name: Format
        run: uv run ruff format --diff

      - name: Lint
        run: uv run ruff check

      - name: Types
        run: uv run ty check

      # Integration tests need a live Blue Core, so they stay deselected here.
      - name: Run tests
        run: uv run pytest
